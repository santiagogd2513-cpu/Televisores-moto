name: Minecraft Skin Studio - Android APK

on:
  push:
    branches:
      - app/minecraft-skin-studio-ci
    paths:
      - 'MinecraftSkinStudioJava/**'
      - '.github/workflows/minecraft-skin-studio.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build APK
        working-directory: MinecraftSkinStudioJava
        run: gradle --no-daemon assembleDebug

      - name: Upload APK for testing
        uses: actions/upload-artifact@v4
        with:
          name: Minecraft-Skin-Studio-debug
          path: MinecraftSkinStudioJava/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
