name: Build HoloBuilder

on:
  push:
    branches: [ "ram-televisores", "main" ]
    paths:
      - "holobuilder/**"
      - ".github/workflows/holobuilder-build.yml"
  pull_request:
    branches: [ "ram-televisores", "main" ]
    paths:
      - "holobuilder/**"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: holobuilder

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Make gradlew executable
        run: |
          if [ -f gradlew ]; then chmod +x gradlew; fi

      - name: Build
        run: |
          if [ -f gradlew ]; then
            ./gradlew build --no-daemon
          else
            echo "gradlew not present yet – skipping full Forge build"
            echo "Add the Forge MDK wrapper (gradlew + gradle/wrapper) to holobuilder/ to enable CI builds."
          fi

      - name: Upload artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: holobuilder-jar
          path: holobuilder/build/libs/*.jar
          if-no-files-found: ignore
