services:
  - type: web
    name: televisores-moto
    runtime: node
    plan: free
    branch: claude/audio-video-upload-page-ywby40
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/files
    envVars:
      - key: MAX_SIZE_MB
        value: "500"
      # Almacenamiento permanente (Backblaze B2 u otro compatible con S3). Ver README.
      - key: S3_ENDPOINT
        sync: false
      - key: S3_BUCKET
        sync: false
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false
